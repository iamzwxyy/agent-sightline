name: Verify
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel, windows-latest]
        node: [22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Verify native Claude file policies in the isolated Linux runner
        if: runner.os == 'Linux'
        shell: bash
        run: |
          test ! -e /etc/claude-code
          sudo install -d -o "$(id -u)" -g "$(id -g)" /etc/claude-code
          SIGHTLINE_TEST_MANAGED_POLICY=1 node --import tsx --test --test-name-pattern='Claude permission precedence|Claude native managed MCP files' tests/claude-runtime.test.ts
      - run: npm audit --omit=dev
      - run: npx playwright install --with-deps chromium
      - run: npm run test:web
      - name: Install Firefox
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps firefox
      - name: Verify Firefox desktop
        if: runner.os == 'Linux'
        run: npx playwright test --browser=firefox --output=test-results/firefox
      - run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.os }}-node-${{ matrix.node }}
          path: agent-sightline-*.tgz
